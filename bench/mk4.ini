# Minimal Prusa MK4 0.4mm nozzle / 0.20mm SPEED/STRUCTURAL-like config for reproducible benchmarks
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 220
nozzle_diameter = 0.4
filament_diameter = 1.75
extrusion_Cleanup = 0
use_relative_e_distances = 1
gcode_flavor = marlin2
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = gyroid
top_fill_pattern = monotoniclines
bottom_fill_pattern = monotonic
extrusion_width = 0.45
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
arc_fitting = emit_center
arc_fitting_resolution = 0.025
skirts = 1
skirt_distance = 3
start_gcode = M83\nG90\nG28\nG1 X0 Y-3 Z0.2 F3000\nG1 X60 E9 F1000\nG1 X100 E12.5 F1000\nG92 E0
end_gcode = M104 S0\nM140 S0\nG1 X0 Y200 F3000\nM84
layer_gcode = ;LAYER_CHANGE\n;Z:[layer_z]\n;HEIGHT:[layer_height]
binary_gcode = 0
