name: Release

# Publishes gcode-sheet-<arch>.run (the flake's `run` output) as a GitHub release, which
# is what the README's download one-liner fetches. Pushes to main that can change the
# executable publish v1.0.<run number>; pushing a v* tag, or running the workflow by
# hand, publishes too.
on:
  push:
    branches: [ main ]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - gcode-sheet.mjs
      - package.json
      - package-lock.json
      - .github/workflows/release.yml
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so an older run can never finish last and become "latest".
# GitHub keeps only the newest pending run: pushes that land while a release is
# building are coalesced, and only the most recent of them is released.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build gcode-sheet-${{ matrix.arch }}.run
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Check and build
        run: |
          nix flake check -L
          cp -L "$(nix build .#run --print-out-paths)" gcode-sheet-${{ matrix.arch }}.run

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gcode-sheet-${{ matrix.arch }}
          path: gcode-sheet-${{ matrix.arch }}.run
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=v1.0.$GITHUB_RUN_NUMBER
          fi
          gh release create "$tag" gcode-sheet-x86_64.run gcode-sheet-aarch64.run \
            --target "$GITHUB_SHA" --title "$tag" --generate-notes --latest
