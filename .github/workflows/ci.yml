name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  flake-check:
    name: nix flake check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run nix flake check
        run: nix flake check -L

  setup-script:
    name: scripts/setup.sh without Nix (${{ matrix.runner }}${{ matrix.rootless && ', rootless' || '' }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        rootless:
          - false
          - true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run setup script
        run: scripts/setup.sh
        env:
          FORCE_ROOTLESS: ${{ matrix.rootless && '1' || '0' }}

      - name: Run tests
        run: npm test
